# TEST TIERS (CI-4). What blocks a push, and what runs somewhere else. Every test runs in exactly one place (or two, where
# a test is both a correctness check and carries a budget), and nothing is deleted: a test is only MOVED between tiers.
# One environment variable, STUDIO_TEST_TIER, read by both runners (`bun test` through studio/scripts/realWorkerTests.ts,
# `node --test` under Electron's Node through studio/scripts/electronNodeTests.ts); the rules are in studio/testing/README.md.
#
#   blocking    `build` (macOS + Windows, every push to main and every tag): the whole suite, correctness only. A wall-clock
#               budget in it has a generous bound that only a runaway trips (assertBudget in studio/testing/tiers.ts).
#   perf        `perf` (every push to main, never blocks): the `[perf]` tests with their tight wall-clock budgets enforced and
#               the numbers printed: deadline headroom, the event-loop gap, "stays fast on the worst input". ubuntu per push;
#               Windows joins in the scheduled tier.
#   quarantine  `quarantine` (every push to main, never blocks, skipped while the list is empty): the `[quarantine]` tests.
#               A test that flakes ONCE is added to studio/testing/quarantine.ts with the failing run id and the date, and
#               tagged in the same change, so main stops going red on it and the signal stays. It leaves the list when it
#               is fixed. Quarantine is never a fix.
#   scheduled   `heavy`, `canary` and the Windows leg of `perf` (the weekly cron, or a manual run with tier "scheduled"; ubuntu
#               except that leg): the `[heavy]` tests (the font byte-mutation fuzz, the sticker script in a fresh process),
#               the randomized suite on `bun latest`, and the perf numbers on Windows's coarse timers. Not per push: they cost
#               minutes and say nothing a push could have changed.
name: studio
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "default: what a push to main runs (build, perf, quarantine). scheduled: the weekly tier only (heavy tests, canary)."
        type: choice
        options:
          - default
          - scheduled
        default: default
  push:
    tags:
      - "studio-v*"
    # Studio builds on src/core and src/node, so a uniquifier-side change that
    # breaks it must fail here before a release. GitHub does not apply `paths`
    # to tag pushes, so tags always run.
    branches:
      - main
    paths:
      - "studio/**"
      - "src/core/**"
      - "src/node/**"
      - "electron.studio.vite.config.ts"
      - "electron-builder.studio.yml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/studio.yml"
  # Weekly, so a `latest`-Bun regression (like the one the canary job guards
  # against) is caught even on a week with no studio push, and the heavy tier
  # (see the tiers above) runs on a timer instead of on every push.
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: write
# A superseded run on a branch (a second dispatch or push of the same ref) is cancelled, so it stops spending
# runner minutes on a result nobody will read. Main and tags are never cancelled: every push to main must finish,
# so a red commit stays identifiable, and a release run must not be cut short. Their group is unique per run
# (run_id), not just non-cancelling: with a shared group and cancel-in-progress off, GitHub still drops an older
# PENDING run when a newer one queues behind the running one, and that would skip a main commit's check.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    # The schedule trigger (and a manual run of the scheduled tier) is only for the
    # heavy and canary jobs below; the full (optionally packaging) build has
    # nothing to do on a timer.
    if: github.event_name != 'schedule' && inputs.tier != 'scheduled'
    strategy:
      # One OS failing must not cancel the other: each has its own smoke to report.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # A push to main only checks; tags (and manual runs) build installers.
      PACKAGE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      # Pinned, via .bun-version (the convention setup-bun's bun-version-file
      # input, and version managers such as mise/asdf, read; `bun` itself has
      # no built-in version-file lookup, so this only keeps CI and whoever
      # points their version manager at this file on the same Bun): a newer
      # Bun rejects the AbortSignal that a happy-dom-registered global
      # AbortController hands to native `fetch` ("signal is not of type
      # AbortSignal"), which broke studio/engine/openrouter/loopback.test.ts
      # here on every push once Bun picked that up. testSetup.ts /
      # loopback.test.ts now swap in the native AbortController/AbortSignal
      # for that file's tests, so `latest` passes again too (see the canary
      # job) — this pin is for reproducibility (CI and local runs on the same
      # Bun), not a live bug.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      # T7b, the face gate: the two model binaries (38.7 MB + 233 KB) are
      # never committed (studio/engine/face/modelSource.ts, .gitignore) — CI
      # fetches them into the same cache path bun test/build:studio read,
      # keyed on modelSource.ts itself (the only place the pinned sha256s
      # live, so a hash change here busts the cache automatically). parity.test.ts
      # fails the run outright if this step did not leave them in place,
      # rather than silently skipping the parity check (its own CI guard).
      #
      # Review fix: this step used to run only `if: cache-hit != 'true'`, so
      # a cache HIT skipped it entirely and the restored bytes were never
      # sha256-checked — a corrupted or tampered cache entry would go
      # straight into the build. `ensureFaceModels` (faceModelCache.ts)
      # already verifies before doing any network call and skips the fetch
      # itself when the cached file is valid, so running this step
      # unconditionally costs nothing on a hit and closes that gap.
      - name: Cache face gate models
        id: face-models-cache
        uses: actions/cache@v4
        with:
          path: .cache/studio-face-models
          key: face-models-${{ hashFiles('studio/engine/face/modelSource.ts') }}
      - name: Fetch face gate models
        run: bun run models:face
      - name: Check the tag matches studio/version.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(bun -e 'console.log((await Bun.file("studio/version.json").json()).extraMetadata.version)')
          if [ "$TAG" != "studio-v$version" ]; then
            echo "::error::tag $TAG does not match studio/version.json ($version)"
            exit 1
          fi
      # A skipped postinstall (or bun failing to materialize a platform binary)
      # leaves a package without its binary, and the installer would still
      # build — just without a working ffmpeg inside. ffprobe is not shipped in
      # Studio yet, but src/node (which Studio builds on) needs it. The paths
      # come from the packages themselves, exactly as the code resolves them.
      - name: Check the ffmpeg and ffprobe binaries are present
        shell: bash
        run: |
          bun -e '
          const { accessSync, constants } = require("node:fs");
          const mode = process.platform === "win32" ? constants.F_OK : constants.X_OK;
          let failed = false;
          for (const [name, path] of [["ffmpeg-static", require("ffmpeg-static")], ["ffprobe-static", require("ffprobe-static").path]]) {
            try { if (!path) throw new Error("no binary for this platform"); accessSync(path, mode); console.log(`${name}: ${path}`); }
            catch (e) { console.log(`::error::${name} binary missing or not executable: ${path} (${e.message})`); failed = true; }
          }
          process.exit(failed ? 1 : 0)'
      - run: bunx tsc --noEmit -p studio/tsconfig.json
      # studio/shared is the contract the engine, the main process and the renderer all import: it must typecheck with NO Node,
      # Bun or DOM types (its own tsconfig sets `types: []`), which the step above (Node types included) does not prove. Moved
      # here from two tests that each spawned this same tsc (CI-4: 4 and 3 s on Windows).
      - run: bunx tsc --noEmit -p studio/shared/tsconfig.json
      # Bounded so a future hang (like the Windows one an unref'd
      # AbortSignal.timeout() timer caused here — fixed by timeoutSignal.ts's
      # ref'd replacement) fails in minutes, not by holding a runner for
      # hours until GitHub's own job-level limit kicks in: each attempt is
      # killed after 15 minutes by the script itself (a hang is never
      # retried), and this step's limit is the bound of every attempt it may
      # take (3 shards x 3 attempts x 15 minutes) plus slack. The suite runs
      # as 3 shards, each its own bun process with its own bound and retry
      # (see realWorkerTests.ts): Windows needs 7.5 to 10+ minutes for all of
      # it, and it grows, so one bound for the whole suite would have to keep
      # growing too.
      #
      # Run through studio/scripts/realWorkerTests.ts: Bun itself segfaults
      # while tearing down a terminated WASM worker (right after
      # workerGate.test.ts's interruption test, on macOS), which takes the
      # whole suite down with no failed test. The script retries — at most 3
      # attempts — ONLY on a Bun crash with no failed test (a failed test,
      # a load error or a hang is never retried), and prints a ::warning::
      # on every retry.
      - run: bun run test:studio:suite ./studio
        timeout-minutes: 150
      # The real workers' tests (the face worker's, the text worker's) run under ELECTRON'S NODE, the product's own
      # runtime (studio/scripts/electronNodeTests.ts: bun bundles them, the Electron binary runs them as plain Node).
      # Not under Bun: there `worker.terminate()` does not interrupt running wasm (the text deadline test would
      # measure Bun: 2015 ms on CI against 202 ms in Electron's Node), and terminating a wasm worker segfaults Bun in
      # a few percent of runs (`Segmentation fault at address 0x3C`; `mprotect failed: 487` on Windows). There is no
      # Bun crash to retry here, so no retry: any failure is real. The face tests need the models fetched above, and
      # a run without them fails, it never skips. The step also prints the worst legitimate shadow caption on this
      # runner, which the text test holds to at most a fifth of the deadline (median) and a third of it (second-slowest of 7).
      - name: Real worker tests (Electron's Node)
        run: bun run test:studio:electron-node
        timeout-minutes: 30
      - if: env.PACKAGE == 'true'
        run: bun run build:studio
      # Studio's version comes from studio/version.json via the config's `extends`.
      - if: env.PACKAGE == 'true'
        run: bunx electron-builder --config electron-builder.studio.yml --publish never
      # Plan T7b: "installer size (+≈53 MB) tracked in CI" — the face gate's
      # onnx models (out-studio/engine/models/**) and onnxruntime-web's WASM
      # runtime are the two biggest additions this repo ships. Budget: 220
      # MiB, from a real measurement (mac arm64 .dmg, 2026-09-27,
      # electron-builder.studio.yml's inverted onnxruntime-web exclusion in
      # place): 182 MiB, +38 MiB margin for Windows NSIS's different
      # compression and normal future growth — tight enough that
      # accidentally shipping even one of the excluded WASM variants again
      # (each 17-28 MB) would still trip it.
      - name: Check the installer size stays under budget
        if: env.PACKAGE == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            files=(release-studio/*.dmg)
          else
            files=(release-studio/*.exe)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no installer found in release-studio/"
            exit 1
          fi
          file=${files[0]}
          bytes=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file")
          mib=$((bytes / 1024 / 1024))
          budget=220
          echo "installer: $file ($mib MiB, budget $budget MiB)"
          if [ "$mib" -gt "$budget" ]; then
            echo "::error::installer size ${mib} MiB exceeds the ${budget} MiB budget"
            exit 1
          fi
      # Launches the package as shipped, before anything is uploaded: fuses set,
      # the E2E override compiled out, the engine utilityProcess started from
      # inside app.asar, --remote-debugging-port refused. GitHub's macOS and
      # Windows runners have a desktop session, so the app starts as is.
      - name: Smoke-test the packaged app
        if: env.PACKAGE == 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls -d release-studio/mac*/Studio.app | head -n 1)
          else
            app=release-studio/win-unpacked
          fi
          bun studio/scripts/smoke-engine.ts --production --app "$app"
      # An E2E package (STUDIO_E2E=1: the base-URL override honoured, invariant
      # 13; the folder-picker and remote-debugging test switches kept) so the
      # full smoke can drive it end to end, avatar creation against a mock
      # OpenRouter included (studio/scripts/mockOpenRouter.ts) — never a real
      # request, never a real key. This package is never uploaded or
      # published: it is a throwaway build for this job only.
      - name: Build the E2E package (never uploaded)
        if: env.PACKAGE == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            bun run dist:studio:mac:e2e
          else
            bun run dist:studio:win:e2e
          fi
      - name: Smoke-test the E2E package (avatar end-to-end against the mock, and the render scenario)
        if: env.PACKAGE == 'true'
        # The E2E build shortens the two waits that dominated this step (STUDIO_E2E in money/reconcile.ts and money/budget.ts:
        # the reconcile quiet period 120 s -> 5 s and the request timeout 180 s -> 15 s, which the kill-and-resume scenario
        # waits out on top of it, ~300 s -> ~20 s); a production build carries the real ones (the production smoke checks it).
        # That took the step from about 465 s to about a minute. Since 3a.9 the step also runs the render scenario (six real
        # renders, two engine kills with restarts, playback; plan 3a.9 and 3e.1): CI measured 154 s on macOS and 194 s on
        # Windows (the runners have 3 to 4 cores). 10 minutes keeps margin for a slow runner and still ends a hang.
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls -d release-studio/e2e/mac*/*.app | head -n 1)
          else
            app=release-studio/e2e/win-unpacked
          fi
          bun studio/scripts/smoke-engine.ts --app "$app"
      - if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.os }}
          path: |
            release-studio/*.dmg
            release-studio/*.exe
          if-no-files-found: ignore
      - name: Attach installers to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The landing page reads the "latest" release, which must stay the uniquifier's.
          make_latest: false
          files: |
            release-studio/*.dmg
            release-studio/*.exe

  # The perf tier (see TEST TIERS at the top): the tests tagged `[perf]`, with
  # their tight wall-clock budgets ENFORCED and their numbers printed. These are
  # measurements of the runner as much as of the code (deadline headroom, the
  # event-loop gap, "stays fast on the worst input"), so they must not decide
  # whether a push is red: `continue-on-error` keeps the workflow green and the
  # numbers stay in the log. Per push it runs on ubuntu only, the quiet
  # reference (1x, not the 2x of Windows or the 10x of macOS in the private
  # repo's minutes). On the weekly schedule (and a manual run of the scheduled
  # tier) Windows joins: its coarse timers are why these bounds flaked, so its
  # numbers are worth having, just not on every push. The blocking `build` job
  # still runs every one of these tests, with a generous bound.
  perf:
    name: perf (${{ matrix.os }})
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || inputs.tier == 'scheduled') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    permissions:
      contents: read
    env:
      STUDIO_TEST_TIER: perf
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      # The face worker's perf test needs the two models, like the build job's tests do (same cache, same step).
      - name: Cache face gate models
        uses: actions/cache@v4
        with:
          path: .cache/studio-face-models
          key: face-models-${{ hashFiles('studio/engine/face/modelSource.ts') }}
      - name: Fetch face gate models
        run: bun run models:face
      # Only the `[perf]` tests run (STUDIO_TEST_TIER above): the script opens just the files that hold one.
      - name: Perf tests (bun)
        run: bun run test:studio:suite ./studio
        timeout-minutes: 60
      - name: Perf tests (Electron's Node)
        if: ${{ !cancelled() }}
        run: bun run test:studio:electron-node
        timeout-minutes: 30

  # The quarantine tier (see TEST TIERS at the top): `[quarantine]` tests, the
  # ones that flaked and are waiting for a fix. Non-blocking, like perf. While
  # studio/testing/quarantine.ts is empty (the normal state) nothing below runs
  # and nothing is billed: a cheap ubuntu job reads the list's length, and the
  # OS matrix (the OSes the flakes show on, macOS at 10x) only starts when there
  # is something to run.
  quarantine-list:
    name: quarantine list
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.tier != 'scheduled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Count the quarantined tests
        id: count
        shell: bash
        run: echo "count=$(bun -e 'import { QUARANTINE } from "./studio/testing/quarantine"; console.log(QUARANTINE.length)')" >> "$GITHUB_OUTPUT"

  quarantine:
    name: quarantine (${{ matrix.os }})
    needs: quarantine-list
    if: needs.quarantine-list.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    permissions:
      contents: read
    env:
      STUDIO_TEST_TIER: quarantine
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      - name: Cache face gate models
        uses: actions/cache@v4
        with:
          path: .cache/studio-face-models
          key: face-models-${{ hashFiles('studio/engine/face/modelSource.ts') }}
      - name: Fetch face gate models
        run: bun run models:face
      - name: Quarantined tests (bun)
        run: bun run test:studio:suite ./studio
        timeout-minutes: 60
      - name: Quarantined tests (Electron's Node)
        if: ${{ !cancelled() }}
        run: bun run test:studio:electron-node
        timeout-minutes: 30

  # The heavy tier (see TEST TIERS at the top): `[heavy]` tests, the slow ones a
  # push does not need: the font byte-mutation fuzz and the sticker script run
  # in a fresh process. Platform-independent, so ubuntu only (1x of the private
  # repo's minutes; macOS bills 10x, Windows 2x). On the weekly schedule a
  # failure turns the run red (GitHub only emails a failed scheduled run); on a
  # manual run of the scheduled tier it does not.
  heavy:
    name: heavy
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'scheduled')
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
    env:
      STUDIO_TEST_TIER: heavy
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      - name: Heavy tests (bun)
        run: bun run test:studio:suite ./studio
        timeout-minutes: 60

  # Early warning for the next Bun release breaking studio: the `build` job
  # above is pinned to .bun-version for reproducibility, so it would not catch
  # that on its own. Scheduled tier only (the weekly cron, or a manual run of
  # tier "scheduled"): it used to run on every push, non-blocking, and said the
  # same thing as the pinned macOS and Windows runs unless Bun itself moved.
  # Dropping the per-push Linux run loses one signal: a case-sensitive file
  # system (a wrong-case import passes on macOS and Windows), caught weekly
  # here instead of per push. Non-blocking on a manual run (`continue-on-error`,
  # so it never fails the workflow there), but not on the weekly schedule run
  # — a green scheduled run either way would be
  # silent (GitHub only emails on a failed scheduled run), so a schedule
  # failure must turn the run red to be noticed. One OS is enough for a
  # version-drift check; ubuntu-latest, not macOS, to keep minutes down (this
  # repo is private, and macOS runners bill at roughly 10x). ffmpeg-static
  # ships a linux-x64 binary and ffprobe-static bundles one, so nothing here
  # needs macOS specifically; the binary-presence check step is duplicated
  # from the `build` job above (GitHub Actions has no step-level reuse within
  # one workflow file) as a guard against a bad linux-x64 postinstall. No
  # installer build, no OS × version matrix.
  #
  # Re-review N4: the face gate's decode moved off Electron's `nativeImage`
  # into a WASM JPEG/PNG decoder inside the engine (security review, T7b
  # section A) — parity.test.ts and distinctPattern.test.ts's own real-gate
  # proof no longer need a desktop session, only the two model files this job
  # was missing. Fetching them here (the same cache + step the `build` job
  # above uses, keyed the same way) means this job now also runs the real
  # face-gate parity check on every push AND the weekly schedule, on Linux —
  # not only macOS/Windows. Before this fix, the weekly scheduled run (not
  # continue-on-error) turned red every week: parity.test.ts's own CI guard
  # fails loudly rather than silently skipping when it expects the models
  # and cannot find them.
  canary:
    name: canary (bun latest)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'scheduled')
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Check the ffmpeg and ffprobe binaries are present
        shell: bash
        run: |
          bun -e '
          const { accessSync, constants } = require("node:fs");
          const mode = process.platform === "win32" ? constants.F_OK : constants.X_OK;
          let failed = false;
          for (const [name, path] of [["ffmpeg-static", require("ffmpeg-static")], ["ffprobe-static", require("ffprobe-static").path]]) {
            try { if (!path) throw new Error("no binary for this platform"); accessSync(path, mode); console.log(`${name}: ${path}`); }
            catch (e) { console.log(`::error::${name} binary missing or not executable: ${path} (${e.message})`); failed = true; }
          }
          process.exit(failed ? 1 : 0)'
      # N4: same cache + fetch as the `build` job above — see this job's own
      # header comment for why a Linux runner can use them now too.
      - name: Cache face gate models
        id: face-models-cache
        uses: actions/cache@v4
        with:
          path: .cache/studio-face-models
          key: face-models-${{ hashFiles('studio/engine/face/modelSource.ts') }}
      - name: Fetch face gate models
        run: bun run models:face
      - run: bunx tsc --noEmit -p studio/tsconfig.json
      # The shared contract's own typecheck (no Node, Bun or DOM types), as in the build job, here under `bun latest`'s tsc resolution.
      - run: bunx tsc --noEmit -p studio/shared/tsconfig.json
      # Same bounds as the build job's own step above, but the retry is narrower: the canary exists to catch
      # a `bun latest` regression, so only the known worker-teardown segfaults (at 0x18 and at
      # 0xFFFFFFFFFFFFFFF8) are retried, and any other crash fails the job. That holds for BOTH steps below (the
      # `:canary` scripts pass --known-crashes-only). Every retry, here and in the build job, is printed as a
      # ::warning:: annotation so the crash rate stays visible.
      - run: bun run test:studio:suite:canary ./studio --randomize
        timeout-minutes: 150
      # The real workers' Electron-Node tests (face and text): the canary's `bun latest` is only the bundler here.
      - name: Real worker tests (Electron's Node)
        run: bun run test:studio:electron-node
        timeout-minutes: 30
