name: studio-ffmpeg-facts

# Dispatch-only spike (SP3): records what the bundled ffmpeg supports per platform.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Run the ffmpeg facts probe
        run: bun spike/ffmpeg-facts/probe.ts ffmpeg-facts-${{ runner.os }}-${{ runner.arch }}.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-facts-${{ runner.os }}-${{ runner.arch }}
          path: ffmpeg-facts-*.json
          if-no-files-found: warn
