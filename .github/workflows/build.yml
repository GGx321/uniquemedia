name: build
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bunx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: uniquemedia-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: ignore
