appId: com.uniquemedia.app
productName: uniquemedia
directories:
  output: release
afterPack: ./scripts/sign-adhoc.cjs
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/exiftool-vendored.pl/**
  - node_modules/exiftool-vendored.exe/**
mac:
  target:
    - dmg
  category: public.app-category.video
  icon: build/icons/uniquemedia/AppIcon.icon
win:
  target:
    - nsis
  icon: build/icons/uniquemedia/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
