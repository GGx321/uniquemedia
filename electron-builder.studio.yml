# Studio: the second app in this repo, packaged apart from the uniquifier
# (electron-builder.yml). Build with `bun run build:studio` first.
#
# Version: studio/version.json holds { extraMetadata: { version } } and is
# pulled in through `extends`, so every invocation of this config (scripts, CI,
# a bare `electron-builder --config electron-builder.studio.yml`) stamps Studio's
# own version into the packaged package.json instead of the uniquifier's.
extends: ./studio/version.json
appId: com.uniquemedia.studio
productName: Studio
directories:
  output: release-studio
afterPack: ./scripts/sign-adhoc.cjs
files:
  - out-studio/**/*
  - package.json
  # The generated built-in stickers (3b.5): 10 APNGs and catalog.json, ~7 MB,
  # already compressed. They stay inside the integrity-checked asar, where
  # Electron's fs reads them; how ffmpeg gets a real file path (a per-job copy
  # or asarUnpack) is 3b.6's decision, not made here.
  - studio/assets/stickers/*.apng
  - studio/assets/stickers/catalog.json
  # ffprobe-static (every platform's binary, ~335 MB unpacked) and exiftool are
  # `dependencies` for the uniquifier's sake; nothing in studio/ uses them yet.
  # Drop the exclusions (and restore their asarUnpack entries, as in
  # electron-builder.yml) when Studio starts to.
  - "!node_modules/ffprobe-static{,/**/*}"
  - "!node_modules/exiftool-vendored*{,/**/*}"
  # onnxruntime-web (T7b, the face gate) ships dist/ for every build target
  # (plain/jsep/asyncify/jspi WASM, webgl, webgpu, the "all" and "wasm"
  # bundles, .map files), plus a lib/ of TypeScript sources and a docs/ —
  # none of which the engine's utilityProcess (a Node context, never a
  # renderer) touches. Review fix: an earlier version of this file excluded
  # variants one glob at a time and still missed ~50 MB of dead weight
  # (ort.all.*, ort.webgl.*, ort.webgpu.*, ort.jspi.*, the non-wasm
  # bundle/.map files, lib/, docs/). Inverted instead: exclude the whole
  # package, then re-include only package.json (needed for Node's own
  # "exports" resolution to even find the entry below) and the 3 files
  # Node's real ESM resolver picks for `import * as ort from
  # "onnxruntime-web"` under Electron's Node (verified directly: `node
  # --input-type=module -e "console.log(await
  # import.meta.resolve('onnxruntime-web'))"` resolves to
  # dist/ort.node.min.mjs, which itself only ever loads the plain
  # ort-wasm-simd-threaded.{wasm,mjs} pair, per its own minified source and
  # spike/face-js/README.md's "Environments and threading" table).
  - "!node_modules/onnxruntime-web/**"
  - node_modules/onnxruntime-web/package.json
  - node_modules/onnxruntime-web/dist/ort.node.min.mjs
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs
extraMetadata:
  # The root package.json `main` points at the uniquifier.
  main: out-studio/main/main.js
  # Electron derives the userData directory from the package name; without
  # this Studio would share ~/Library/Application Support/uniquemedia with it.
  name: uniquemedia-studio
asarUnpack:
  - node_modules/ffmpeg-static/**
  # T7b, the face gate: the face model files, onnxruntime-web's WASM runtime
  # and — T7c — the face worker thread's own entry (out-studio/engine/
  # faceWorker.js, loaded by file URL from the engine) all stay inside
  # app.asar (see `files` above) rather than being listed here — an
  # asarUnpack entry would put them outside the asar's integrity check
  # (enableEmbeddedAsarIntegrityValidation), and WASM and a worker script are
  # executable code. The packaged E2E smoke proves it: the run scenario's
  # `qa.faceCos` exists only if the worker started from inside the asar and
  # loaded ORT's WASM and the two models there (Electron's `fs` reads
  # asar-packed files transparently), and smoke-engine.ts's asar checks
  # require the worker entry to be in the asar and NOT unpacked. Only if that
  # ever turns out to be impossible, unpack exactly those files, narrow
  # smoke-engine.ts's "the engine is not unpacked from the asar" check to
  # allow exactly them, and verify the models' sha256 at load (the worker
  # already does).
# Electron fuses, flipped in the packaged binary: no ELECTRON_RUN_AS_NODE, no
# NODE_OPTIONS, no --inspect, the app only from app.asar and that asar checked
# against the hash embedded at build time, cookies encrypted at rest. Check
# with `bunx @electron/fuses read --app release-studio/mac-arm64/Studio.app`.
# Fuses are flipped after the afterPack hook has ad-hoc signed the bundle, which
# breaks that signature: resetAdHocDarwinSignature re-signs it (ad hoc, --deep)
# right after the flip, or macOS would kill the app at launch.
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
# No auto-update feed: app-update.yml would point at this repo's Releases,
# where "latest" is the uniquifier.
publish: null
mac:
  target:
    - dmg
  category: public.app-category.video
  # Stay ad-hoc (scripts/sign-adhoc.cjs) rather than picking up whatever Apple
  # Development certificate happens to be in the local keychain.
  identity: null
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
